version: '3.8'

name: tqa-f

services:
  f-detector:
    build:
      context: .
      dockerfile: docker/Dockerfile.detector
    image: tqa-f:detector
    container_name: tqa-f-detector
    restart: unless-stopped
    environment:
      - CH_HOST=${CH_HOST:-10.0.0.60}
      - CH_PORT=${CH_PORT:-8123}
      - CH_DB=${CH_DB:-moex}
      - PG_HOST=${PG_HOST:-10.0.0.60}
      - PG_PORT=${PG_PORT:-5432}
      - PG_DB=${PG_DB:-moex}
      - PG_USER=${PG_USER:-postgres}
    command: python scripts/detector_cli.py scan --tickers MN --dry-run

  f-loader:
    build:
      context: .
      dockerfile: docker/Dockerfile.loader
    image: tqa-f:loader
    container_name: tqa-f-loader
    restart: unless-stopped
    environment:
      - CH_HOST=${CH_HOST:-10.0.0.60}
      - CH_PORT=${CH_PORT:-8123}
      - CH_DB=${CH_DB:-moex}
    command: python scripts/loader_cli.py --loop 60

  f-position:
    build:
      context: .
      dockerfile: docker/Dockerfile.position
    image: tqa-f:position
    container_name: tqa-f-position
    restart: unless-stopped
    environment:
      - CH_HOST=${CH_HOST:-10.0.0.60}
      - CH_PORT=${CH_PORT:-8123}
      - CH_DB=${CH_DB:-moex}
      - PG_HOST=${PG_HOST:-10.0.0.60}
      - PG_PORT=${PG_PORT:-5432}
      - PG_DB=${PG_DB:-moex}
      - PG_USER=${PG_USER:-postgres}
    command: python scripts/position_cli.py --mode paper --tickers MN