# Тестовый PostgreSQL для разработки и отладки стратегий
# Прод: 10.0.0.60:5432 — не трогать
# Тест: localhost:5433 — можно ломать

services:
  pg:
    image: postgres:16-alpine
    container_name: tqa-pg-test
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: tqa
      POSTGRES_DB: tqa
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tqa"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    depends_on:
      pg:
        condition: service_healthy
    environment:
      PG_URL: "postgresql://postgres:tqa@localhost:5433/tqa"
      CH_HOST: "10.0.0.60"
      CH_DB: "crypto"
    command:
      - python3
      - -m
      - tqa_framework.engine.cli
      - --ch-db
      - crypto
      - backtest
      - --tickers
      - BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT
      - --strategy-yaml
      - lsr_cross
      - --tf
      - "60"
      - --days
      - "365"
      - --risk-pct
      - "0.14"
      - --equity
      - "1000"
      - --max-conc
      - "6"

volumes:
  pg-data: