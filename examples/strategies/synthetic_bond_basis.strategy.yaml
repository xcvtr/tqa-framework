name: synthetic_bond_basis
version: 1
description: "Synthetic bond: LONG basis when zscore(basis, 20d) < -2, SHORT when > +2"

params:
  lookback_days:
    type: int
    default: 20
    min: 5
    max: 100
  z_entry:
    type: float
    default: 2.0
    description: "Z-score порог входа"
  z_exit:
    type: float
    default: 0.5
    description: "Z-score порог выхода (отыгрыш)"
  sl_pct:
    type: float
    default: 0.03
  tp_pct:
    type: float
    default: 0.10
  risk_pct:
    type: float
    default: 0.03

metrics:
  basis:
    formula: sma(close, 1)
  zscore_basis:
    formula: zscore(close, {{lookback_days}} * 24)
    depends: [basis]
  sma_basis:
    formula: sma(basis, {{lookback_days}} * 24)

entry_rules:
  - priority: 10
    action: BUY_LONG
    params:
      quantity: "{{risk_pct}}"
      sl: "{{sl_pct}}"
      tp: "{{tp_pct}}"
    conditions:
      all:
        - metric: zscore_basis
          op: "<"
          value: "-{{z_entry}}"

  - priority: 20
    action: SELL_SHORT
    params:
      quantity: "{{risk_pct}}"
      sl: "{{sl_pct}}"
      tp: "{{tp_pct}}"
    conditions:
      all:
        - metric: zscore_basis
          op: ">"
          value: "{{z_entry}}"

exit_rules:
  - priority: 10
    action: CLOSE_LONG
    conditions:
      any:
        - metric: zscore_basis
          op: between
          value: "-{{z_exit}},{{z_exit}}"
        - metric: pnl_pct
          op: "<="
          value: "{{sl_pct}}"
          source: position
        - metric: pnl_pct
          op: ">="
          value: "{{tp_pct}}"
          source: position
        - metric: bars_held
          op: ">="
          value: 360
          source: position

  - priority: 20
    action: CLOSE_SHORT
    conditions:
      any:
        - metric: zscore_basis
          op: between
          value: "-{{z_exit}},{{z_exit}}"
        - metric: pnl_pct
          op: "<="
          value: "{{sl_pct}}"
          source: position
        - metric: pnl_pct
          op: ">="
          value: "{{tp_pct}}"
          source: position
        - metric: bars_held
          op: ">="
          value: 360
          source: position

sweep:
  enabled: true
  params:
    z_entry: [1.5, 2.0, 2.5, 3.0]
    lookback_days:
      interval: [10, 40]
    sl_pct:
      range: [0.02, 0.05, 0.01]
    tp_pct:
      range: [0.05, 0.20, 0.05]
  max_combinations: 64